<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b16" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Chess Career" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Chess Career Mode: build a chess career from aspiring player to World Champion." />
    <title>Chess Career Mode</title>
  </head>
  <body>
    <div id="root"></div>
    <section id="boot-recovery" hidden role="alert" style="max-width:32rem;margin:20vh auto;padding:1.5rem;font:16px system-ui;color:#f3e8d1;background:#182538;border-radius:1rem">
      <p>The game is taking longer to open. Reload to request fresh game files.</p>
      <button type="button" id="boot-reload">Reload game</button>
      <a href="/recovery.html" style="color:inherit;margin-inline-start:1rem">Startup recovery</a>
    </section>
    <script>
      (() => {
        const reveal = () => {
          if (!document.getElementById('root').hasChildNodes()) {
            document.getElementById('boot-recovery').hidden = false;
          }
        };
        const reload = () => {
          const url = new URL(location.href);
          url.searchParams.set('retry-load', Date.now());
          location.replace(url);
        };
        document.getElementById('boot-reload').onclick = reload;
        window.addEventListener('error', ({ target }) => {
          if (!(target instanceof HTMLScriptElement) || target.type !== 'module') return;
          const retry = new URLSearchParams(location.search).has('retry-load');
          if (navigator.onLine && navigator.serviceWorker?.controller && !retry) {
            reload();
          } else {
            reveal();
          }
        }, true);
        new MutationObserver((_, observer) => {
          document.getElementById('boot-recovery').hidden = true;
          observer.disconnect();
        }).observe(document.getElementById('root'), { childList: true });
        setTimeout(reveal, 20000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
